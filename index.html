<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Blog preview card - Bootstrap</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <link rel="stylesheet" href="styles.css" />
  </head>
  <body
    class="d-flex flex-column align-items-center justify-content-center min-vh-100 fw-medium fs-6 m-0"
  >
    <main class="card rounded-4 d-flex flex-column align-items-center gap-4 bg-white p-4">
      <div class="blog-image">
        <img
          class="w-auto rounded-3"
          style="height: 200px"
          src="./assets/images/illustration-article.svg"
          alt="Article illustration"
        />
      </div>
      <div class="d-flex flex-column text-start w-100" style="gap: 12px">
        <button href="#" class="learnig-button btn align-self-start fw-bold">
          Learning
        </button>
        <p class="m-0 fw-medium text-secondary small">Published 21 Dec 2023</p>
        <h1
          class="title-card fs-4 fw-bold text-start p-0 m-0 link-dark text-decoration-none"
        >
          HTML & CSS foundations
        </h1>
        <div class="m-0 text-secondary">
          These languages are the backbone of every website, defining structure,
          content, and presentation.
        </div>
      </div>
      <div class="d-flex align-items-center gap-3 w-100 mt-3">
        <img
          class="rounded-circle"
          style="width: 32px; height: 32px; object-fit: cover"
          src="./assets/images/image-avatar.webp"
          alt="Avatar of Greg Hooper"
        />
        <span class="fw-bold text-dark small">Greg Hooper</span>
      </div>
    </main>
    <footer
      class="text-center text-secondary p-4"
      style="font-size: 0.6875rem; padding: 30px !important"
    >
      Challenge by
      <a href="#" class="link-dark text-decoration-none fw-bold"
        >Frontend Mentor</a
      >. Coded by
      <a href="#" class="link-dark text-decoration-none fw-bold"
        >Mamadou Moussa Balde</a
      >.
    </footer>
  </body>
</html>
